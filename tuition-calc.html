<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>课时费计算工具</title>
<style>
:root {
  --primary: #4f46e5; --primary-light: #eef2ff; --primary-dark: #4338ca;
  --success: #16a34a; --success-light: #dcfce7;
  --danger: #dc2626; --danger-light: #fef2f2;
  --warning: #f59e0b; --warning-light: #fffbeb;
  --bg: #f1f5f9; --card: #fff; --border: #e2e8f0;
  --text: #1e293b; --text-secondary: #64748b;
  --radius: 10px; --shadow: 0 1px 3px rgba(0,0,0,0.06);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;-webkit-tap-highlight-color:transparent}

/* ===== 顶栏 ===== */
.topbar{background:var(--card);border-bottom:1px solid var(--border);padding:0 16px;height:50px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.topbar .logo{font-size:16px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:6px}
.topbar .logo span{font-size:20px}
.topbar-actions{display:flex;gap:6px;align-items:center}

/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;transition:all .15s;white-space:nowrap;font-family:inherit;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:#fff;color:var(--text);border-color:var(--border)}
.btn-outline:hover{background:#f8fafc}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-xs{padding:4px 8px;font-size:11px;border-radius:6px}
.btn-block{width:100%}
.btn-lg{padding:10px 20px;font-size:15px}
.btn-ghost{background:transparent;border:none;color:var(--text-secondary)}
.btn-ghost:hover{color:var(--primary);background:#f8fafc}
.btn:disabled{opacity:.5;pointer-events:none}

/* ===== 桌面布局 ===== */
.desktop-layout{max-width:1200px;margin:0 auto;padding:16px;display:grid;grid-template-columns:240px 1fr;gap:12px;min-height:calc(100vh - 50px)}
.sidebar{display:flex;flex-direction:column;gap:10px}
.sidebar-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.sidebar-card-header{padding:12px 14px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:space-between}
.main-area{display:flex;flex-direction:column;gap:12px}
.main-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}

/* ===== 学生列表 ===== */
.student-list{flex:1;overflow-y:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
.student-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;cursor:pointer;transition:background .1s;border-left:3px solid transparent;gap:6px;font-size:14px}
.student-item:hover{background:#f8fafc}
.student-item.active{background:var(--primary-light);border-left-color:var(--primary);font-weight:600}
.student-item .s-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.student-item .s-delete{opacity:0;color:var(--danger);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:4px;background:none;border:none;line-height:1}
.student-item:hover .s-delete{opacity:.6}
.student-item .s-delete:hover{opacity:1;background:var(--danger-light)}
.add-student-row{padding:10px 12px;display:flex;gap:6px;border-top:1px solid var(--border)}
.add-student-row input{flex:1;padding:8px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;min-width:0}
.add-student-row input:focus{outline:none;border-color:var(--primary)}
.empty-students{padding:28px 12px;text-align:center;color:#94a3b8;font-size:13px}

/* ===== 统计卡片 ===== */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow)}
.stat-card .sc-label{font-size:11px;font-weight:600;color:var(--text-secondary);letter-spacing:.3px;margin-bottom:2px}
.stat-card .sc-value{font-size:20px;font-weight:700}
.stat-card.highlight{background:linear-gradient(135deg,#4f46e5,#6366f1);border-color:transparent}
.stat-card.highlight .sc-label,.stat-card.highlight .sc-value{color:#fff}

/* ===== Tab导航（移动端） ===== */
.mobile-tabs{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);z-index:150;box-shadow:0 -2px 8px rgba(0,0,0,.06);height:56px;padding-bottom:env(safe-area-inset-bottom)}
.mobile-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:none;background:none;font-size:10px;color:var(--text-secondary);cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent;transition:color .15s}
.mobile-tab .tab-icon{font-size:20px}
.mobile-tab.active{color:var(--primary);font-weight:600}

/* ===== 步骤指示器 ===== */
.steps-indicator{display:flex;align-items:center;justify-content:center;padding:16px 20px;gap:0}
.step-dot{display:flex;align-items:center;gap:0}
.step-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid var(--border);color:var(--text-secondary);background:#fff;transition:all .3s}
.step-circle.done{background:var(--success);border-color:var(--success);color:#fff}
.step-circle.current{background:var(--primary);border-color:var(--primary);color:#fff}
.step-line{width:60px;height:2px;background:var(--border);margin:0 8px;transition:all .3s}
.step-line.done{background:var(--success)}
.step-label{font-size:11px;color:var(--text-secondary);text-align:center;margin-top:4px;white-space:nowrap}
.step-label.current{color:var(--primary);font-weight:600}
.step-dot-wrap{display:flex;flex-direction:column;align-items:center}

/* ===== 排课设置表单 ===== */
.form-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.form-section h4{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.form-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.form-row label{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;min-width:60px}
.form-input{padding:8px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:#fff}
.form-input:focus{outline:none;border-color:var(--primary)}
.select-wrap{position:relative}
.select-wrap select{padding:8px 10px;border:1.5px solid var(--border);border-radius:6px;font-size:13px;font-family:inherit;background:#fff;appearance:none;padding-right:28px;cursor:pointer}
.select-wrap select:focus{outline:none;border-color:var(--primary)}
.select-wrap::after{content:'▾';position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:12px;color:var(--text-secondary)}

/* ===== 星期选择 ===== */
.weekday-group{display:flex;gap:6px;flex-wrap:wrap}
.weekday-chip{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:#fff;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;font-family:inherit;white-space:nowrap;user-select:none}
.weekday-chip:hover{border-color:var(--primary);color:var(--primary)}
.weekday-chip.selected{background:var(--primary);color:#fff;border-color:var(--primary)}
.weekday-chip.weekend{border-color:#fecaca;color:#dc2626}
.weekday-chip.weekend.selected{background:var(--primary);color:#fff;border-color:var(--primary)}

/* ===== 学生标签 ===== */
.student-tags{display:flex;flex-wrap:wrap;gap:6px}
.student-tag{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:16px;background:var(--primary-light);color:var(--primary-dark);font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;border:1.5px solid transparent;user-select:none}
.student-tag:hover{background:#e0e7ff}
.student-tag.selected{border-color:var(--primary);box-shadow:0 0 0 2px rgba(79,70,229,.2)}

/* ===== 月历 ===== */
.month-block{margin-bottom:20px}
.month-title{font-size:15px;font-weight:700;color:var(--text);padding:10px 0;border-bottom:2px solid var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:8px}
.month-table{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.month-table thead th{background:#f8fafc;padding:8px 4px;text-align:center;font-weight:600;color:var(--text-secondary);font-size:11px;border-bottom:2px solid var(--border)}
.month-table thead th.weekend{color:#dc2626}
.month-table tbody td{padding:4px;border:1px solid #f1f5f9;vertical-align:top;height:90px;position:relative}
.month-table .day-num{font-weight:600;font-size:13px;margin-bottom:2px}
.month-table .day-date{font-size:10px;color:var(--text-secondary);margin-bottom:2px}

/* 上课日 */
.month-table .cell-scheduled{background:#f0fdf4;border:1px solid #bbf7d0}
.month-table .cell-scheduled .day-num{color:#15803d}
.month-table .cell-scheduled .status-label{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600;background:#bbf7d0;color:#15803d;margin-bottom:2px}

/* 调课日 */
.month-table .cell-adjust{background:#dbeafe;border:1px solid #93c5fd}
.month-table .cell-adjust .day-num{color:#1e40af}
.month-table .cell-adjust .status-label{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600;background:#bfdbfe;color:#1e40af;margin-bottom:2px}

/* 请假日 */
.month-table .cell-absent{background:var(--danger-light);border:1px solid #fecaca}
.month-table .cell-absent .day-num{color:#dc2626}
.month-table .cell-absent .status-label{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600;background:#fecaca;color:#dc2626;margin-bottom:2px}

/* 范围内非上课日 */
.month-table .cell-inrange{background:#fafafa}
.month-table .cell-inrange .day-num{color:var(--text-secondary)}

/* 范围外 */
.month-table .cell-outrange{background:#f1f5f9;color:#cbd5e1}
.month-table .cell-outrange .day-num{color:#cbd5e1}
.month-table .cell-outrange .day-date{color:#cbd5e1}

/* 空单元格（补位） */
.month-table .cell-empty{background:#f8fafc}

/* 单元格内元素 */
.cell-content{font-size:11px}
.cell-content .lesson-time{font-size:10px;color:var(--text-secondary);margin-bottom:2px}
.cell-content .content-input{width:100%;padding:2px 4px;border:1px solid #d1d5db;border-radius:4px;font-size:11px;font-family:inherit;background:#fff}
.cell-content .content-input:focus{outline:none;border-color:var(--primary)}
.cell-content .type-select{width:100%;padding:2px 4px;border:1px solid #d1d5db;border-radius:4px;font-size:11px;font-family:inherit;background:#fff;margin-bottom:2px;cursor:pointer}
.cell-content .type-select:focus{outline:none;border-color:var(--primary)}
.cell-content .btn-add-adjust{padding:2px 6px;font-size:10px;border-radius:4px;border:1px dashed var(--border);background:#fff;color:var(--primary);cursor:pointer;font-family:inherit}
.cell-content .btn-add-adjust:hover{background:var(--primary-light);border-color:var(--primary)}
.cell-content .btn-remove-adjust{padding:2px 6px;font-size:10px;border-radius:4px;border:1px solid var(--border);background:#fff;color:var(--danger);cursor:pointer;font-family:inherit}
.cell-content .btn-remove-adjust:hover{background:var(--danger-light)}

/* ===== 费用明细表 ===== */
.fee-summary{padding:16px}
.fee-summary .total-card{background:linear-gradient(135deg,var(--primary),#6366f1);color:#fff;border-radius:var(--radius);padding:20px;text-align:center;margin-bottom:16px}
.fee-summary .total-card .big-num{font-size:36px;font-weight:800}
.fee-summary .total-card .big-label{font-size:13px;opacity:.85;margin-top:4px}
.fee-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:16px}
.fee-table th{background:#f8fafc;padding:8px 12px;text-align:left;font-weight:600;font-size:11px;color:var(--text-secondary);border-bottom:2px solid var(--border)}
.fee-table td{padding:8px 12px;border-bottom:1px solid #f1f5f9}
.fee-table .highlight-row{background:var(--primary-light);font-weight:600}

/* ===== 我的页面 ===== */
.mine-sections{display:flex;flex-direction:column;gap:12px}
.mine-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.mine-card h4{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.semester-list{display:flex;flex-direction:column;gap:8px}
.semester-item{background:#f8fafc;border-radius:8px;padding:12px;cursor:pointer;transition:all .15s;border:1.5px solid transparent}
.semester-item:hover{background:var(--primary-light);border-color:var(--primary)}
.semester-item .sem-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.semester-item .sem-name{font-weight:600;font-size:14px}
.semester-item .sem-fee{color:var(--primary);font-weight:700;font-size:15px}
.semester-item .sem-meta{font-size:12px;color:var(--text-secondary);margin-top:4px}
.semester-detail{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.semester-detail.open{display:block}
.monthly-table{width:100%;border-collapse:collapse;font-size:12px}
.monthly-table th{background:#f1f5f9;padding:6px 8px;text-align:left;font-weight:600}
.monthly-table td{padding:6px 8px;border-bottom:1px solid #f1f5f9}
.lesson-detail-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.lesson-detail-table th{background:#f8fafc;padding:6px 8px;text-align:left;font-weight:600;font-size:11px;color:var(--text-secondary);border-bottom:2px solid var(--border)}
.lesson-detail-table td{padding:6px 8px;border-bottom:1px solid #f1f5f9}
.student-stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}

/* ===== 登记表(简化版) ===== */
.register-section{padding:16px}
.register-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.register-header h4{font-size:14px;font-weight:600}
.attendance-list{display:flex;flex-direction:column;gap:6px}
.attendance-row{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border:1px solid var(--border);border-radius:8px;flex-wrap:wrap}
.attendance-row .att-date{font-size:12px;color:var(--text-secondary);min-width:85px}
.attendance-row .att-content{flex:1;min-width:120px}
.attendance-row .att-content input{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;font-family:inherit}
.attendance-row .att-content input:focus{outline:none;border-color:var(--primary)}
.attendance-row .att-fee{min-width:60px;text-align:right;font-weight:600;color:var(--primary);font-size:12px}

/* ===== Toast ===== */
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* ===== 弹窗 ===== */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.6);z-index:200;align-items:center;justify-content:center;padding:16px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:12px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:#fff;z-index:1}
.modal-header h3{font-size:16px}
.modal-close{background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-secondary);padding:4px 8px;border-radius:6px}
.modal-close:hover{background:#f1f5f9}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;position:sticky;bottom:0;background:#fff}

/* ===== 调课弹窗 ===== */
.reschedule-form{display:flex;flex-direction:column;gap:12px}
.reschedule-form label{font-size:13px;font-weight:600;display:flex;flex-direction:column;gap:4px}
.reschedule-form .src-info{background:#f8fafc;padding:10px 14px;border-radius:8px;font-size:13px;color:var(--text-secondary);line-height:1.6}
.reschedule-form .collision-warn{display:none;background:var(--warning-light);border:1px solid #fbbf24;padding:10px 14px;border-radius:8px;font-size:13px;color:#92400e;line-height:1.6}
.reschedule-form .collision-warn .clash-item{font-weight:600;color:#d97706}
.reschedule-form .time-pair{display:flex;align-items:center;gap:8px}
.reschedule-form .time-pair span{color:var(--text-secondary);font-size:13px}
.reschedule-form .date-hint{font-size:11px;color:var(--text-secondary);margin-top:-6px}

/* ===== 隐藏 ===== */
.hidden{display:none!important}
.tab-page{display:none}
.tab-page.active{display:block}
.step-page{display:none}
.step-page.active{display:block}

/* ===== 手机端适配 ===== */
@media (max-width:768px){
  .desktop-layout{grid-template-columns:1fr;padding:8px;gap:8px;padding-bottom:70px}
  .sidebar{display:none}
  .mobile-tabs{display:flex}
  .stats-row{grid-template-columns:repeat(2,1fr);gap:6px}
  .stat-card{padding:10px 12px}
  .stat-card .sc-value{font-size:18px}
  .topbar{padding:0 10px;height:44px}
  .topbar .logo{font-size:14px}
  .form-row{flex-direction:column;align-items:stretch}
  .form-row label{min-width:auto}
  .student-stats-row{grid-template-columns:repeat(2,1fr)}
  .month-table{font-size:11px}
  .month-table tbody td{height:75px;padding:2px}
  .cell-content .content-input,.cell-content .type-select{font-size:10px}
  .step-line{width:30px;margin:0 4px}
  .attendance-row{gap:4px;padding:6px 8px}
}

@media (min-width:769px){.mobile-tabs{display:none}}

@media print{
  body{background:#fff}
  .topbar,.mobile-tabs,.modal-overlay,.sidebar,.steps-indicator{display:none!important}
  .print-area{display:block!important;padding:20px}
}
</style>
</head>
<body>

<!-- 顶栏 -->
<div class="topbar">
  <div class="logo"><span>📚</span> <span id="topbarTitle">课时费计算</span></div>
  <div class="topbar-actions">
    <span id="saveIndicator" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#16a34a;margin-right:4px">💾 已保存</span>
    <button class="btn btn-outline btn-sm" onclick="exportAllData()">💾 备份</button>
    <button class="btn btn-outline btn-sm" onclick="importDataPrompt()">📥 恢复</button>
  </div>
</div>

<div class="desktop-layout" id="desktopLayout">
  <!-- 侧边栏：学生列表 -->
  <div class="sidebar" id="desktopSidebar">
    <div class="sidebar-card">
      <div class="sidebar-card-header">
        👥 学生管理
        <span class="badge badge-active" id="studentCount" style="display:inline-block;padding:1px 7px;border-radius:8px;background:#dcfce7;color:#15803d;font-size:11px">0</span>
      </div>
      <div class="student-list" id="studentList">
        <div class="empty-students">还没有学生<br>👇 下方添加</div>
      </div>
      <div class="add-student-row">
        <input type="text" id="newStudentInput" placeholder="学生姓名" onkeydown="if(event.key==='Enter')addStudent()">
        <button class="btn btn-primary btn-xs" onclick="addStudent()">+</button>
      </div>
    </div>
  </div>

  <!-- 主内容区 -->
  <div class="main-area" id="mainArea">
    <!-- ===== 排课 Tab ===== -->
    <div class="tab-page active" id="tabSchedule">
      <!-- 步骤指示器 -->
      <div class="main-card" style="margin-bottom:12px">
        <div class="steps-indicator" id="stepsIndicator">
          <div class="step-dot">
            <div class="step-dot-wrap"><div class="step-circle current" id="s1circle">1</div><div class="step-label current" id="s1label">排课设置</div></div>
            <div class="step-line" id="line12"></div>
            <div class="step-dot-wrap"><div class="step-circle" id="s2circle">2</div><div class="step-label" id="s2label">排课表</div></div>
            <div class="step-line" id="line23"></div>
            <div class="step-dot-wrap"><div class="step-circle" id="s3circle">3</div><div class="step-label" id="s3label">费用计算</div></div>

              <button class="weekday-chip" data-day="2" onclick="toggleWeekday(2,this)">周二</button>

              <button class="weekday-chip weekend" data-day="6" onclick="toggleWeekday(6,this)">周六</button>
              <button class="weekday-chip weekend" data-day="7" onclick="toggleWeekday(7,this)">周日</button>
            </div>
          </div>
          <div class="form-row">
            <label>时间段</label>
            <input type="time" class="form-input" id="timeStart" value="14:00" style="width:120px">
            <span style="color:var(--text-secondary)">至</span>
            <input type="time" class="form-input" id="timeEnd" value="16:00" style="width:120px">
            <span style="font-size:11px;color:var(--text-secondary)">（默认2小时）</span>

          <div class="form-row">
            <label>课时费</label>
            <span style="font-size:15px;color:var(--primary);font-weight:600">¥</span>

        <div class="form-section">
          <h4>👥 学生 <button class="btn btn-xs btn-outline" onclick="openAddStudentToSchedule()" style="margin-left:8px">+ 添加</button></h4>
          <div class="student-tags" id="scheduleStudentTags">
            <span style="font-size:12px;color:#94a3b8">请点击选择参与排课的学生</span>
          </div>
        </div>
        <div class="form-section">
          <h4>📋 快捷操作</h4>
          <button class="btn btn-outline btn-sm" onclick="copyLastSchedule()">📋 复制上次排课</button>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:8px;padding:8px 0">
          <button class="btn btn-primary btn-lg" onclick="goToStep2()" id="btnToStep2">下一步：生成课表 →</button>
        </div>
      </div>

      <!-- Step 2: 排课表 -->
      <div class="step-page" id="step2">
        <div class="main-card">
          <div style="padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px">
            <h4 style="font-size:14px">📅 学期课表 · <span id="calTitle" style="color:var(--primary)">-</span></h4>
            <div style="display:flex;gap:4px;flex-wrap:wrap">
              <button class="btn btn-outline btn-xs" onclick="resetAllToNormal()">全部恢复上课</button>
              <button class="btn btn-outline btn-xs" onclick="clearAllAdjust()">清空所有调课</button>
            </div>
          </div>
          <div id="calendarContainer" style="padding:12px 16px"></div>
        </div>
        <div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0">
          <button class="btn btn-outline btn-lg" onclick="goToStep1()">← 上一步</button>
          <button class="btn btn-primary btn-lg" onclick="goToStep3()">下一步：计算费用 →</button>
        </div>
      </div>

      <!-- Step 3: 费用计算 -->
      <div class="step-page" id="step3">
        <div class="main-card">
          <div class="fee-summary" id="feeSummary">
            <p style="text-align:center;color:#94a3b8;padding:40px">正在计算...</p>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;gap:8px;padding:8px 0">
          <button class="btn btn-outline btn-lg" onclick="goToStep2()">← 上一步</button>
          <button class="btn btn-success btn-lg" onclick="saveSchedule()">💾 保存排课</button>
        </div>
      </div>
    </div>

    <!-- ===== 登记 Tab ===== -->
    <div class="tab-page" id="tabRegister">
      <div class="main-card">
        <div class="register-section">
          <div class="register-header">
            <h4>📋 出勤登记</h4>
            <div style="display:flex;gap:6px;align-items:center">
              <span style="font-size:13px;color:var(--text-secondary)">选择学期：</span>
              <div class="select-wrap"><select id="registerSemesterSelect" onchange="renderRegister()" style="font-size:12px"></select></div>
              <button class="btn btn-outline btn-sm" onclick="editSchedule()" title="修改当前选中排课的时间/调课/学生">✏️ 修改排课</button>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- 打印区 -->
<div class="print-area" id="printArea" style="display:none"></div>

<script>
// ============================================================
// 数据模型 v4.1： lessons 改为每天一条记录
// lessons: { "YYYY-MM-DD": { time, type, content, fee } }
// type: 'normal' | 'adjust' | 'absent'
// ============================================================
const STORAGE_KEY = 'tuition_calc_v4_1';
let appData = { students: [], schedules: [] };
let currentTab = 'schedule';
let scheduleStep = 1;
let tempSchedule = null;
let selectedStudents = new Set();

// ===== 初始化 =====
(function init() {
  loadData();
  renderStudentList();
  initDates();
  initTempSchedule();
  renderStep1Students();
  updateScheduleSelects();
  switchTab('schedule');
  showToast('✅ 已加载 ' + appData.students.length + ' 名学生，' + appData.schedules.length + ' 条排课');
})();

function initDates() {
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth();
  let semStart, semEnd, season;
  if (m >= 2 && m <= 5) { semStart = y+'-02-15'; semEnd = y+'-06-30'; season='春季'; }
  else if (m >= 6 && m <= 7) { semStart = y+'-07-01'; semEnd = y+'-08-31'; season='暑假'; }
  else if (m >= 8 && m <= 11) { semStart = y+'-09-01'; semEnd = y+'-12-31'; season='秋季'; }
  else { semStart = y+'-01-15'; semEnd = y+'-02-14'; season='寒假'; }
  document.getElementById('schedDateStart').value = semStart;
  document.getElementById('schedDateEnd').value = semEnd;
  document.getElementById('semesterYear').value = y;
  document.getElementById('semesterSeason').value = season;
}

// ===== 数据读写 =====
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) { const p = JSON.parse(raw); if (p && Array.isArray(p.students)) appData = p; }
    // 尝试读取旧key兼容
    if (!appData.students.length) {
      const old = localStorage.getItem('tuition_calc_v4');
      if (old) { const p = JSON.parse(old); if (p && Array.isArray(p.students)) appData = p; }
    }
  } catch(e) { appData = { students: [], schedules: [] }; }
}
function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    const ind = document.getElementById('saveIndicator');
    if (ind) { ind.textContent = '✅ 已保存'; ind.style.color = '#16a34a';
      clearTimeout(ind._timeout); ind._timeout = setTimeout(()=>{ind.textContent='💾 已保存';ind.style.color='#16a34a';},1500); }
  } catch(e) {
    const ind = document.getElementById('saveIndicator');
    if (ind) { ind.textContent = '⚠ 保存失败'; ind.style.color = '#dc2626'; }
  }
}

// ===== 学生管理 =====
function addStudent() {
  const input = document.getElementById('newStudentInput');
  const name = input.value.trim();
  if (!name) { showToast('请输入学生姓名'); return; }
  if (appData.students.some(s=>s.name===name)) { showToast('该学生已存在'); return; }
  appData.students.push({ id: 's_'+Date.now(), name });
  saveData(); renderStudentList(); updateScheduleSelects(); renderStep1Students();
  input.value = '';
  showToast('已添加：'+name);
}
function addStudentFromModal() {
  const input = document.getElementById('modalNewStudentName');
  const name = input.value.trim();
  if (!name) { showToast('请输入学生姓名'); return; }
  if (appData.students.some(s=>s.name===name)) { showToast('该学生已存在'); return; }
  const s = { id: 's_'+Date.now(), name };
  appData.students.push(s);
  selectedStudents.add(s.id);
  saveData(); renderStudentList(); renderStep1Students(); renderModalStudents();
  input.value = '';
  showToast('已添加并选择：'+name);
}
function deleteStudent(id, name) {
  if (!confirm('确定删除「'+name+'」？此操作将同时删除该学生在所有排课中的记录。')) return;
  appData.students = appData.students.filter(s=>s.id!==id);
  appData.schedules.forEach(sch=>{ sch.studentIds = sch.studentIds.filter(sid=>sid!==id); });
  appData.schedules = appData.schedules.filter(sch=>sch.studentIds.length>0);
  selectedStudents.delete(id);
  saveData(); renderStudentList(); renderStep1Students(); updateScheduleSelects();
  if (currentTab==='mine') renderMineTab();
  showToast('已删除：'+name);
}
function renderStudentList() {
  const list = document.getElementById('studentList');
  const countEl = document.getElementById('studentCount');
  countEl.textContent = appData.students.length;
  if (appData.students.length===0) {
    list.innerHTML = '<div class="empty-students">还没有学生<br>👇 下方添加</div>';
  } else {
    list.innerHTML = appData.students.map(s=>{
      const hasSched = appData.schedules.some(sch=>sch.studentIds.includes(s.id));
      return `<div class="student-item" onclick="selectStudentForSidebar('${s.id}')">
        <span class="s-name">👤 ${escHtml(s.name)} ${hasSched?'<span style="font-size:10px;color:var(--primary)">📅</span>':''}</span>
        <button class="s-delete" onclick="event.stopPropagation();deleteStudent('${s.id}','${escHtml(s.name)}')">×</button>
      </div>`;
    }).join('');
  }
}
function selectStudentForSidebar(id) {
  switchTab('mine');
  document.getElementById('tabMine').setAttribute('data-student', id);
  renderMineTab(id);
}
function getStudentName(id) { const s=appData.students.find(s=>s.id===id); return s?s.name:'未知'; }

// ===== Tab切换 =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab'+tab.charAt(0).toUpperCase()+tab.slice(1)).classList.add('active');
  document.querySelectorAll('.mobile-tab').forEach(t=>t.classList.remove('active'));
  const mt = document.querySelector('.mobile-tab[data-tab="'+tab+'"]');
  if (mt) mt.classList.add('active');
  if (tab==='mine') {
    const sid = document.getElementById('tabMine').getAttribute('data-student');
    renderMineTab(sid||null);
  }
  if (tab==='register') renderRegister();
}

// ===== 临时排课数据 =====
function initTempSchedule() {
  tempSchedule = {
    id: null, semester: '', year: new Date().getFullYear(),
    dateStart: '', dateEnd: '', feePerClass: 700,
    weekdays: [], timeStart: '14:00', timeEnd: '16:00',
    studentIds: [], lessons: {}
  };
  selectedStudents.clear();
  scheduleStep = 1;
  showStep(1);
}

function gatherStep1Data() {
  tempSchedule.semester = document.getElementById('semesterSeason').value;
  tempSchedule.year = parseInt(document.getElementById('semesterYear').value) || new Date().getFullYear();
  tempSchedule.dateStart = document.getElementById('schedDateStart').value;
  tempSchedule.dateEnd = document.getElementById('schedDateEnd').value;
  tempSchedule.feePerClass = parseInt(document.getElementById('feePerClass').value) || 700;
  tempSchedule.timeStart = document.getElementById('timeStart').value;
  tempSchedule.timeEnd = document.getElementById('timeEnd').value;
  tempSchedule.studentIds = Array.from(selectedStudents);
  const chips = document.querySelectorAll('#weekdayGroup .weekday-chip.selected');
  tempSchedule.weekdays = Array.from(chips).map(c=>parseInt(c.dataset.day));
}

// ===== 星期选择 =====
function toggleWeekday(day, el) { el.classList.toggle('selected'); }
function selectWeekdays(days) {
  document.querySelectorAll('#weekdayGroup .weekday-chip').forEach(c=>{
    c.classList.toggle('selected', days.includes(parseInt(c.dataset.day)));
  });
}

// ===== 排课学生选择 =====
function renderStep1Students() {
  const container = document.getElementById('scheduleStudentTags');
  if (appData.students.length===0) {
    container.innerHTML = '<span style="font-size:12px;color:#94a3b8">还没有学生，请先添加</span>';
    return;
  }
  container.innerHTML = appData.students.map(s=>{
    const sel = selectedStudents.has(s.id);
    return `<span class="student-tag${sel?' selected':''}" onclick="toggleScheduleStudent('${s.id}',this)" data-sid="${s.id}">👤 ${escHtml(s.name)}</span>`;
  }).join('');
}
function toggleScheduleStudent(sid, el) {
  if (selectedStudents.has(sid)) { selectedStudents.delete(sid); el.classList.remove('selected'); }
  else { selectedStudents.add(sid); el.classList.add('selected'); }
}
function openAddStudentToSchedule() { renderModalStudents(); document.getElementById('addStudentModal').classList.add('active'); }
function closeAddStudentModal() { document.getElementById('addStudentModal').classList.remove('active'); }
function renderModalStudents() {
  const container = document.getElementById('modalStudentTags');
  if (appData.students.length===0) { container.innerHTML = '<span style="font-size:12px;color:#94a3b8">还没有学生</span>'; return; }
  container.innerHTML = appData.students.map(s=>{
    const sel = selectedStudents.has(s.id);
    return `<span class="student-tag${sel?' selected':''}" onclick="toggleScheduleStudent('${s.id}',this)" data-sid="${s.id}">👤 ${escHtml(s.name)}</span>`;
  }).join('');
}
function confirmScheduleStudents() { closeAddStudentModal(); renderStep1Students(); showToast('已更新学生选择'); }

// ===== 步骤切换 =====
function showStep(step) {
  scheduleStep = step;
  document.querySelectorAll('.step-page').forEach(p=>p.classList.remove('active'));
  document.getElementById('step'+step).classList.add('active');
  ['s1circle','s2circle','s3circle','s1label','s2label','s3label'].forEach(id=>{ document.getElementById(id).classList.remove('done','current'); });
  ['line12','line23'].forEach(id=>document.getElementById(id).classList.remove('done'));
  if (step>=1) { document.getElementById('s1circle').classList.add('done'); document.getElementById('s1label').classList.add('done'); }
  if (step>=2) { document.getElementById('line12').classList.add('done'); document.getElementById('s2circle').classList.add('done'); document.getElementById('s2label').classList.add('done'); }
  if (step>=3) { document.getElementById('line23').classList.add('done'); document.getElementById('s3circle').classList.add('done'); document.getElementById('s3label').classList.add('done'); }
  document.getElementById('s'+step+'circle').classList.add('current');
  document.getElementById('s'+step+'label').classList.add('current');
}

function goToStep2() {
  gatherStep1Data();
  if (tempSchedule.weekdays.length===0) { showToast('请至少选择一个上课星期'); return; }
  if (!tempSchedule.dateStart||!tempSchedule.dateEnd) { showToast('请设置日期范围'); return; }
  if (tempSchedule.dateStart >= tempSchedule.dateEnd) { showToast('结束日期必须晚于开始日期'); return; }
  if (tempSchedule.studentIds.length===0) { showToast('请至少选择一名学生'); return; }
  generateCalendar();
  showStep(2);
}
function goToStep1() { showStep(1); }
function goToStep3() { renderFeeSummary(); showStep(3); }

// ===== 生成月历 =====
function generateCalendar() {
  const { dateStart, dateEnd, weekdays, timeStart, timeEnd, feePerClass, semester, year } = tempSchedule;
  const semStart = new Date(dateStart+'T00:00:00');
  const semEnd = new Date(dateEnd+'T00:00:00');
  document.getElementById('calTitle').textContent = semester+'学期 '+year+' · '+dateStart+' 至 '+dateEnd;

  // 初始化 lessons（自动为计划上课日创建记录）
  if (!tempSchedule.lessons) tempSchedule.lessons = {};
  // 清理范围外的旧课程
  // 规则：范围外的课程，若不是调课目标(rescheduleFrom)则删除；若它是源(rescheduleTo)则目标也一并删除
  const toDelete = [];
  for (const ds in tempSchedule.lessons) {
    if (ds < dateStart || ds > dateEnd) {
      const l = tempSchedule.lessons[ds];
      if (l.rescheduleTo) toDelete.push(l.rescheduleTo);
      if (!l.rescheduleFrom) toDelete.push(ds);
    }
  }
  [...new Set(toDelete)].forEach(ds => delete tempSchedule.lessons[ds]);
  for (let d = new Date(semStart); d <= semEnd; d.setDate(d.getDate()+1)) {
    const ds = toLocalDateStr(d);
    const dow = d.getDay(); const wd = dow===0?7:dow;
    if (weekdays.includes(wd) && !tempSchedule.lessons[ds]) {
      tempSchedule.lessons[ds] = { time: timeStart+'-'+timeEnd, type: 'normal', content: '', fee: feePerClass };
    }
  }

  const container = document.getElementById('calendarContainer');
  const weekNames = ['周一','周二','周三','周四','周五','周六','周日'];
  const shortWeek = ['一','二','三','四','五','六','日'];

  // 计算需要显示的月份范围（从start所在月到end所在月）
  let currentMonth = new Date(semStart.getFullYear(), semStart.getMonth(), 1);
  const endMonth = new Date(semEnd.getFullYear(), semEnd.getMonth(), 1);
  let html = '';

  while (currentMonth <= endMonth) {
    const y = currentMonth.getFullYear();
    const m = currentMonth.getMonth(); // 0-based
    const monthTitle = y+'年'+(m+1)+'月';

    // 该月第一天是周几 (0=周日, 我们需要 1=周一)
    const firstDayDow = new Date(y, m, 1).getDay();
    const firstDayOffset = firstDayDow === 0 ? 6 : firstDayDow - 1; // 周一开头需要空几个

    const daysInMonth = new Date(y, m+1, 0).getDate();

    // 表头
    let monthHtml = `<div class="month-block"><div class="month-title">📅 ${monthTitle}</div>`;
    monthHtml += '<table class="month-table"><thead><tr>';
    for (let i=0; i<7; i++) {
      monthHtml += `<th class="${i>=5?'weekend':''}">${weekNames[i]}</th>`;
    }
    monthHtml += '</tr></thead><tbody>';

    // 填充日期
    let dayCellCount = 0;
    let rowHtml = '<tr>';

    // 空单元格补位
    for (let i=0; i<firstDayOffset; i++) {
      rowHtml += '<td class="cell-empty"></td>';
      dayCellCount++;
    }

    for (let day=1; day<=daysInMonth; day++) {
      const date = new Date(y, m, day);
      const dateStr = toLocalDateStr(date);
      const dow = date.getDay();
      const wd = dow===0?7:dow;
      const inRange = date >= semStart && date <= semEnd;
      const isWeekdayMatch = inRange && weekdays.includes(wd);
      const lesson = tempSchedule.lessons[dateStr];
      const hasLesson = !!lesson;

      let cellClass = '';
      let cellContent = '';

      const isRescheduledAway = lesson && lesson.rescheduleTo; // 源：调走了
      const isRescheduledHere = lesson && lesson.rescheduleFrom; // 目标：调过来了

      if (!inRange) {
        cellClass = 'cell-outrange';
        cellContent = `<div class="day-num">${day}</div>`;
      } else if (isRescheduledHere && !isWeekdayMatch) {
        // ✅ 非计划日，但被其他日期的调课调过来了
        cellClass = 'cell-adjust';
        const srcDisplay = lesson.rescheduleFrom.substring(5);
        const lt = lesson.time || (timeStart+'-'+timeEnd);
        const contentVal = escAttr(lesson.content || '');
        cellContent = `
          <div class="day-num">${day}</div>
          <div class="cell-content">
            <span class="status-label" title="从 ${lesson.rescheduleFrom} 调过来">调课 ← ${srcDisplay}</span>
            <div class="lesson-time">${lt}</div>
            <input class="content-input" placeholder="课程内容" value="${contentVal}" onchange="updateLessonContent('${dateStr}',this.value)">
            <button class="btn-remove-adjust" onclick="cancelRescheduleTo('${dateStr}')">取消调课</button>
          </div>`;
      } else if (isWeekdayMatch) {
        // 计划上课日
        const type = lesson ? lesson.type : 'normal';
        if (type === 'normal') cellClass = 'cell-scheduled';
        else if (type === 'adjust') cellClass = 'cell-adjust';
        else if (type === 'absent') cellClass = 'cell-absent';

        const contentVal = escAttr(lesson ? lesson.content : '');
        let statusLabel = type==='normal'?'上课':type==='adjust'?'调课':'请假';
        if (isRescheduledAway) {
          const targetDisplay = lesson.rescheduleTo.substring(5);
          statusLabel = '调课 → '+targetDisplay;
        }
        if (isRescheduledHere) {
          const srcDisplay = lesson.rescheduleFrom.substring(5);
          statusLabel = '调课 ← '+srcDisplay;
        }
        const selectVal = type==='normal'?'':type;
        const lt = (lesson && lesson.time) ? lesson.time : (timeStart+'-'+timeEnd);

        cellContent = `
          <div class="day-num">${day}</div>
          <div class="cell-content">
            <span class="status-label">${statusLabel}</span>
            <div class="lesson-time">${lt}</div>
            <select class="type-select" onchange="changeLessonType('${dateStr}',this.value)">
              <option value="" ${selectVal===''?'selected':''}>--</option>
              <option value="adjust" ${selectVal==='adjust'?'selected':''}>调课</option>
              <option value="absent" ${selectVal==='absent'?'selected':''}>请假</option>
            </select>
            <input class="content-input" placeholder="课程内容" value="${contentVal}" onchange="updateLessonContent('${dateStr}',this.value)">
            ${isRescheduledAway ? `<button class="btn-xs btn-outline" style="margin-right:2px" onclick="openRescheduleModal('${dateStr}')">修改</button><button class="btn-remove-adjust" onclick="cancelRescheduleFrom('${dateStr}')">取消</button>` : ''}
          </div>`;
      } else if (hasLesson && lesson.type === 'adjust') {
        // 范围内非计划日的手动加课（无 rescheduleFrom）
        cellClass = 'cell-adjust';
        const contentVal = escAttr(lesson.content || '');
        const lt = lesson.time || (timeStart+'-'+timeEnd);
        cellContent = `
          <div class="day-num">${day}</div>
          <div class="cell-content">
            <span class="status-label">调课</span>
            <div class="lesson-time">${lt}</div>
            <input class="content-input" placeholder="课程内容" value="${contentVal}" onchange="updateLessonContent('${dateStr}',this.value)">
            <button class="btn-remove-adjust" onclick="removeAdjustLesson('${dateStr}')">取消调课</button>
          </div>`;
      } else {
        // 范围内非计划日，留空（调课到了再标蓝）
        cellClass = 'cell-inrange';
        cellContent = `<div class="day-num">${day}</div>`;
      }

      rowHtml += `<td class="${cellClass}">${cellContent}</td>`;
      dayCellCount++;

      if (dayCellCount % 7 === 0) {
        rowHtml += '</tr>';
        monthHtml += rowHtml;
        rowHtml = '<tr>';
      }
    }

    // 末尾补空
    while (dayCellCount % 7 !== 0) {
      rowHtml += '<td class="cell-empty"></td>';
      dayCellCount++;
    }
    if (rowHtml !== '<tr>') { rowHtml += '</tr>'; monthHtml += rowHtml; }

    monthHtml += '</tbody></table></div>';
    html += monthHtml;

    currentMonth.setMonth(currentMonth.getMonth() + 1);
  }

  container.innerHTML = html;
}

let rescheduleSourceDate = null;

function changeLessonType(dateStr, type) {
  if (!tempSchedule.lessons[dateStr]) return;
  if (type === '') {
    // 恢复为正常上课
    const lesson = tempSchedule.lessons[dateStr];
    // 如果之前是调课，需要清理目标日期
    if (lesson.rescheduleTo) {
      delete tempSchedule.lessons[lesson.rescheduleTo];
      delete lesson.rescheduleTo;
    }
    lesson.type = 'normal';
    generateCalendar();
  } else if (type === 'absent') {
    // 请假：如果之前有调课，也要清理
    const lesson = tempSchedule.lessons[dateStr];
    if (lesson.rescheduleTo) {
      delete tempSchedule.lessons[lesson.rescheduleTo];
      delete lesson.rescheduleTo;
    }
    lesson.type = 'absent';
    generateCalendar();
  } else if (type === 'adjust') {
    // 打开调课弹窗
    openRescheduleModal(dateStr);
  }
}

function openRescheduleModal(dateStr) {
  rescheduleSourceDate = dateStr;
  const lesson = tempSchedule.lessons[dateStr];
  if (!lesson) return;
  const timeStr = lesson.time || (tempSchedule.timeStart+'-'+tempSchedule.timeEnd);
  const [tStart, tEnd] = timeStr.split('-');
  document.getElementById('rescheduleSrcInfo').innerHTML = '📅 原上课日期：<strong>'+dateStr+'</strong> · ⏰ '+timeStr;
  document.getElementById('rescheduleTimeStart').value = tStart;
  document.getElementById('rescheduleTimeEnd').value = tEnd;
  document.getElementById('rescheduleContent').value = lesson.content || '';
  // 修改时预填目标日期
  document.getElementById('rescheduleTargetDate').value = lesson.rescheduleTo || '';
  document.getElementById('collisionWarn').style.display = 'none';
  document.getElementById('rescheduleModal').classList.add('active');
}

function closeRescheduleModal() {
  document.getElementById('rescheduleModal').classList.remove('active');
  rescheduleSourceDate = null;
}

function confirmReschedule() {
  const targetDate = document.getElementById('rescheduleTargetDate').value;
  const timeStart = document.getElementById('rescheduleTimeStart').value;
  const timeEnd = document.getElementById('rescheduleTimeEnd').value;
  const content = document.getElementById('rescheduleContent').value.trim();

  if (!targetDate) { showToast('请选择调课日期'); return; }
  if (!timeStart || !timeEnd) { showToast('请设置时间段'); return; }
  if (timeStart >= timeEnd) { showToast('结束时间必须晚于开始时间'); return; }

  // 不能调到同一天
  if (targetDate === rescheduleSourceDate) {
    showToast('调课日期不能和原日期相同'); return;
  }

  const timeStr = timeStart+'-'+timeEnd;

  // 撞课检测
  const collision = checkLessonCollision(rescheduleSourceDate, targetDate, timeStr);
  if (collision) {
    document.getElementById('collisionMsg').innerHTML = collision;
    document.getElementById('collisionWarn').style.display = 'block';
    return;
  }

  // 执行调课
  const srcLesson = tempSchedule.lessons[rescheduleSourceDate];
  const fee = (srcLesson.fee != null && srcLesson.fee !== '') ? srcLesson.fee : tempSchedule.feePerClass;

  // 如果原日期之前也调过课，先清理旧的
  if (srcLesson.rescheduleTo) {
    delete tempSchedule.lessons[srcLesson.rescheduleTo];
  }

  srcLesson.type = 'adjust';
  srcLesson.rescheduleTo = targetDate;

  // 如果目标日期已有记录（比如被其他日期的调课占用），清除
  const existingTarget = tempSchedule.lessons[targetDate];
  if (existingTarget && existingTarget.rescheduleFrom) {
    const originalSrc = tempSchedule.lessons[existingTarget.rescheduleFrom];
    if (originalSrc) { originalSrc.type = 'normal'; delete originalSrc.rescheduleTo; }
  }

  tempSchedule.lessons[targetDate] = {
    time: timeStr,
    type: 'adjust',
    rescheduleFrom: rescheduleSourceDate,
    content: content,
    fee: fee
  };

  closeRescheduleModal();
  generateCalendar();
  showToast('✅ 已设置调课：'+rescheduleSourceDate+' → '+targetDate);
}

function cancelRescheduleFrom(dateStr) {
  // 从源日期取消调课（恢复为 normal）
  const lesson = tempSchedule.lessons[dateStr];
  if (!lesson || !lesson.rescheduleTo) return;
  delete tempSchedule.lessons[lesson.rescheduleTo];
  lesson.type = 'normal';
  delete lesson.rescheduleTo;
  generateCalendar();
  showToast('已取消调课，恢复为正常上课');
}

function cancelRescheduleTo(dateStr) {
  // 从目标日期取消调课（删除目标，恢复源为 normal）
  const lesson = tempSchedule.lessons[dateStr];
  if (!lesson || !lesson.rescheduleFrom) return;
  const srcLesson = tempSchedule.lessons[lesson.rescheduleFrom];
  if (srcLesson) {
    srcLesson.type = 'normal';
    delete srcLesson.rescheduleTo;
  }
  delete tempSchedule.lessons[dateStr];
  generateCalendar();
  showToast('已取消调课');
}

function timeOverlap(t1, t2) {
  const [a1, a2] = t1.split('-').map(t => { const [h,m]=t.split(':'); return parseInt(h)*60+parseInt(m); });
  const [b1, b2] = t2.split('-').map(t => { const [h,m]=t.split(':'); return parseInt(h)*60+parseInt(m); });
  return a1 < b2 && b1 < a2;
}

function checkLessonCollision(sourceDateStr, targetDateStr, timeStr) {
  const clashStudents = [];

  // 1. 检查所有已保存的排课
  for (const sch of appData.schedules) {
    if (!sch.lessons) continue;
    // 跳过当前正在编辑的同一条排课
    if (tempSchedule.id && sch.id === tempSchedule.id) continue;

    const lesson = sch.lessons[targetDateStr];
    if (!lesson || lesson.type === 'absent') continue;

    const lessonTime = lesson.time || (sch.timeStart+'-'+sch.timeEnd);
    if (timeOverlap(timeStr, lessonTime)) {
      const names = sch.studentIds.map(id => getStudentName(id));
      clashStudents.push(...names);
    }
  }

  // 2. 检查当前 tempSchedule 内同一天的其他调课
  if (tempSchedule.lessons) {
    for (const [ds, l] of Object.entries(tempSchedule.lessons)) {
      if (ds === targetDateStr && ds !== sourceDateStr && l.type !== 'absent') {
        const lt = l.time || (tempSchedule.timeStart+'-'+tempSchedule.timeEnd);
        if (timeOverlap(timeStr, lt)) {
          const names = tempSchedule.studentIds.map(id => getStudentName(id));
          clashStudents.push(...names);
        }
      }
      // 检查是否有其他日期也调到了这天
      if (l.rescheduleTo === targetDateStr && ds !== sourceDateStr) {
        const lt = l.time || (tempSchedule.timeStart+'-'+tempSchedule.timeEnd);
        if (timeOverlap(timeStr, lt)) {
          const names = tempSchedule.studentIds.map(id => getStudentName(id));
          clashStudents.push(...names);
        }
      }
    }
  }

  const unique = [...new Set(clashStudents)];
  if (unique.length > 0) {
    return '和 <span class="clash-item">'+unique.map(n=>escHtml(n)).join('、')+'</span> 同学撞课了！<br>请修改调课日期或时间段后重试。';
  }
  return null;
}
function updateLessonContent(dateStr, content) {
  if (tempSchedule.lessons[dateStr]) {
    tempSchedule.lessons[dateStr].content = content;
  }
}
function addAdjustLesson(dateStr) {
  tempSchedule.lessons[dateStr] = {
    time: tempSchedule.timeStart+'-'+tempSchedule.timeEnd,
    type: 'adjust', content: '', fee: tempSchedule.feePerClass
  };
  generateCalendar();
  showToast('已添加调课');
}
function removeAdjustLesson(dateStr) {
  delete tempSchedule.lessons[dateStr];
  generateCalendar();
  showToast('已取消调课');
}
function resetAllToNormal() {
  if (!confirm('确定将所有请假和调课恢复为正常上课？')) return;
  // 第一步：先清理被调过来的目标日期
  for (const key in tempSchedule.lessons) {
    const l = tempSchedule.lessons[key];
    if (l.rescheduleFrom) {
      delete tempSchedule.lessons[key];
    }
  }
  // 第二步：恢复所有源日期为 normal，清理 rescheduleTo
  for (const key in tempSchedule.lessons) {
    const l = tempSchedule.lessons[key];
    if (l.type === 'absent' || l.type === 'adjust') {
      l.type = 'normal';
    }
    delete l.rescheduleTo;
    delete l.rescheduleFrom;
  }
  generateCalendar();
  showToast('已恢复');
}
function clearAllAdjust() {
  if (!confirm('确定清空所有调课（包括调课目标和手动加课）？')) return;
  // 第一步：删除所有调课目标日期（rescheduleFrom 的课）
  for (const key in tempSchedule.lessons) {
    const l = tempSchedule.lessons[key];
    if (l.rescheduleFrom) {
      delete tempSchedule.lessons[key];
    }
  }
  // 第二步：恢复有 rescheduleTo 的源日期 + 删除非计划日的手动加课
  for (const key in tempSchedule.lessons) {
    const l = tempSchedule.lessons[key];
    if (l.rescheduleTo) {
      l.type = 'normal';
      delete l.rescheduleTo;
    }
    // 非计划日的手动加课
    const date = new Date(key+'T00:00:00');
    const dow = date.getDay(); const wd = dow===0?7:dow;
    if (!tempSchedule.weekdays.includes(wd) && !l.rescheduleFrom) {
      delete tempSchedule.lessons[key];
    }
  }
  generateCalendar();
  showToast('已清空调课');
}

// ===== 费用计算 =====
function renderFeeSummary() {
  const container = document.getElementById('feeSummary');
  const { semester, year, dateStart, dateEnd, feePerClass, studentIds } = tempSchedule;
  const lessons = tempSchedule.lessons || {};

  let totalLessons = 0, totalFee = 0, totalAbsent = 0;
  const monthlyStats = {};

  for (const [dateStr, l] of Object.entries(lessons)) {
    const fee = (l.fee!=null&&l.fee!=='') ? l.fee : feePerClass;
    if (l.type === 'absent') {
      totalAbsent++;
      continue;
    }
    // 跳过调课源日期（已计在目标日期），避免重复计数
    if (l.rescheduleTo) continue;
    totalLessons++;
    totalFee += fee;
    const monthKey = dateStr.substring(0,7);
    if (!monthlyStats[monthKey]) monthlyStats[monthKey] = { lessons: 0, fee: 0 };
    monthlyStats[monthKey].lessons++;
    monthlyStats[monthKey].fee += fee;
  }

  const sortedMonths = Object.keys(monthlyStats).sort();
  let monthRows = '';
  sortedMonths.forEach(m=>{
    const s = monthlyStats[m];
    monthRows += `<tr><td>${m}</td><td>${s.lessons}节</td><td style="text-align:right;font-weight:600">¥${s.fee.toFixed(0)}</td></tr>`;
  });

  const monthCount = sortedMonths.length;
  const avgPerMonth = monthCount>0 ? (totalFee/monthCount).toFixed(0) : 0;
  const avgPerLesson = totalLessons>0 ? (totalFee/totalLessons).toFixed(0) : feePerClass;

  // 上课明细
  const detailRows = [];
  for (const [dateStr, l] of Object.entries(lessons).sort((a,b)=>a[0].localeCompare(b[0]))) {
    if (l.type === 'absent' || l.rescheduleTo) continue;
    const d = new Date(dateStr+'T00:00:00');
    const weekNames = ['日','一','二','三','四','五','六'];
    const fee = (l.fee!=null&&l.fee!=='') ? l.fee : feePerClass;
    detailRows.push(`<tr>
      <td>${dateStr}</td>
      <td>周${weekNames[d.getDay()]}</td>
      <td>${l.time}</td>
      <td>${escHtml(l.content||'-')}</td>
      <td style="text-align:right">¥${fee}</td>
    </tr>`);
  }

  let html = `
    <div class="total-card">
      <div class="big-label">${semester}学期 ${year} · 总学费</div>
      <div class="big-num">¥${totalFee.toFixed(0)}</div>
      <div style="font-size:13px;opacity:.85;margin-top:4px">${totalLessons}节课 · 请假${totalAbsent}节 · ${studentIds.length}名学生</div>
    </div>
    <div class="stats-row" style="margin-bottom:16px">
      <div class="stat-card"><div class="sc-label">📖 上课节数</div><div class="sc-value">${totalLessons}</div></div>
      <div class="stat-card"><div class="sc-label">🚫 请假节数</div><div class="sc-value">${totalAbsent}</div></div>
      <div class="stat-card"><div class="sc-label">📊 月均费用</div><div class="sc-value">¥${avgPerMonth}</div></div>
      <div class="stat-card highlight"><div class="sc-label">🏷 平均课时费</div><div class="sc-value">¥${avgPerLesson}</div></div>
    </div>
    <h4 style="font-size:13px;font-weight:600;margin-bottom:8px">📅 月度明细</h4>
    <table class="fee-table">
      <thead><tr><th>月份</th><th>课程</th><th style="text-align:right">费用</th></tr></thead>
      <tbody>${monthRows}
        <tr class="highlight-row"><td><strong>合计</strong></td><td><strong>${totalLessons}节</strong></td><td style="text-align:right"><strong style="color:var(--primary);font-size:15px">¥${totalFee.toFixed(0)}</strong></td></tr>
      </tbody>
    </table>
    <h4 style="font-size:13px;font-weight:600;margin-bottom:8px">📋 上课明细</h4>
    <table class="fee-table">
      <thead><tr><th>日期</th><th>星期</th><th>时间</th><th>课程内容</th><th style="text-align:right">费用</th></tr></thead>
      <tbody>${detailRows.join('')}
        <tr class="highlight-row"><td colspan="4"><strong>合计</strong></td><td style="text-align:right"><strong style="color:var(--primary)">¥${totalFee.toFixed(0)}</strong></td></tr>
      </tbody>
    </table>
    <h4 style="font-size:13px;font-weight:600;margin-bottom:8px">👥 学生明细</h4>
    <table class="fee-table">
      <thead><tr><th>学生</th><th>课时费/节</th><th>总节数</th><th style="text-align:right">应缴费用</th></tr></thead>
      <tbody>
        ${tempSchedule.studentIds.map(sid=>{
          const sname = getStudentName(sid);
          return `<tr><td>👤 ${escHtml(sname)}</td><td>¥${feePerClass}</td><td>${totalLessons}节</td><td style="text-align:right;font-weight:600;color:var(--primary)">¥${totalFee.toFixed(0)}</td></tr>`;
        }).join('')}
      </tbody>
    </table>`;

  container.innerHTML = html;
}

// ===== 保存排课 =====
function saveSchedule() {
  gatherStep1Data();
  const scheduleData = {
    id: tempSchedule.id || 'sch_'+Date.now(),
    semester: tempSchedule.semester, year: tempSchedule.year,
    dateStart: tempSchedule.dateStart, dateEnd: tempSchedule.dateEnd,
    feePerClass: tempSchedule.feePerClass,
    weekdays: tempSchedule.weekdays,
    timeStart: tempSchedule.timeStart, timeEnd: tempSchedule.timeEnd,
    studentIds: tempSchedule.studentIds,
    lessons: JSON.parse(JSON.stringify(tempSchedule.lessons)),
    createdAt: new Date().toISOString()
  };
  const idx = appData.schedules.findIndex(s=>s.id===scheduleData.id);
  if (idx>=0) appData.schedules[idx] = scheduleData;
  else appData.schedules.push(scheduleData);
  saveData(); updateScheduleSelects(); renderStudentList();
  showToast('✅ 排课已保存！');
  initTempSchedule(); initDates(); renderStep1Students(); showStep(1);
}

// ===== 复制上次排课 =====
function copyLastSchedule() {
  if (appData.schedules.length===0) { showToast('没有可复制的排课记录'); return; }
  const last = appData.schedules[appData.schedules.length-1];
  if (!confirm('复制「'+last.semester+'学期 '+last.year+'」的排课设置？')) return;
  document.getElementById('feePerClass').value = last.feePerClass;
  document.getElementById('timeStart').value = last.timeStart;
  document.getElementById('timeEnd').value = last.timeEnd;
  selectWeekdays(last.weekdays);
  tempSchedule.weekdays = [...last.weekdays];
  selectedStudents.clear();
  last.studentIds.forEach(id=>selectedStudents.add(id));
  renderStep1Students();
  const sDate = last.dateStart.split('-');
  const eDate = last.dateEnd.split('-');
  const newStart = (parseInt(sDate[0])+1)+'-'+sDate[1]+'-'+sDate[2];
  const newEnd = (parseInt(eDate[0])+1)+'-'+eDate[1]+'-'+eDate[2];
  document.getElementById('schedDateStart').value = newStart;
  document.getElementById('schedDateEnd').value = newEnd;
  document.getElementById('semesterYear').value = last.year+1;
  document.getElementById('semesterSeason').value = last.semester;
  showToast('已复制排课设置 ✓');
}

function editSchedule() {
  const schId = document.getElementById('registerSemesterSelect').value;
  if (!schId) { showToast('请先选择要修改的排课'); return; }
  const sch = appData.schedules.find(s=>s.id===schId);
  if (!sch) { showToast('未找到排课数据'); return; }

  // 加载排课数据到 tempSchedule
  tempSchedule = {
    id: sch.id,
    semester: sch.semester,
    year: sch.year,
    dateStart: sch.dateStart,
    dateEnd: sch.dateEnd,
    feePerClass: sch.feePerClass,
    weekdays: [...sch.weekdays],
    timeStart: sch.timeStart,
    timeEnd: sch.timeEnd,
    studentIds: [...sch.studentIds],
    lessons: JSON.parse(JSON.stringify(sch.lessons || {}))
  };

  // 填充表单
  document.getElementById('semesterSeason').value = sch.semester;
  document.getElementById('semesterYear').value = sch.year;
  document.getElementById('schedDateStart').value = sch.dateStart;
  document.getElementById('schedDateEnd').value = sch.dateEnd;
  document.getElementById('feePerClass').value = sch.feePerClass;
  document.getElementById('timeStart').value = sch.timeStart;
  document.getElementById('timeEnd').value = sch.timeEnd;

  // 选中星期
  document.querySelectorAll('#weekdayGroup .weekday-chip').forEach(c=>c.classList.remove('selected'));
  sch.weekdays.forEach(d=>{
    const chip = document.querySelector(`#weekdayGroup .weekday-chip[data-day="${d}"]`);
    if (chip) chip.classList.add('selected');
  });

  // 选中学生
  selectedStudents.clear();
  sch.studentIds.forEach(id=>selectedStudents.add(id));

  // 跳转到排课Tab - 第二步
  switchTab('schedule');
  renderStep1Students();   // 先渲染step1学生列表（step2未显示时也可调用）
  showStep(2);             // 激活step2 DOM
  generateCalendar();        // 此时calendarContainer已在DOM中
  showToast('✅ 已加载排课：' + sch.semester + '学期 ' + sch.year + '，可以修改后重新保存');
}

// ===== 更新下拉框 =====
function updateScheduleSelects() {
  const sel = document.getElementById('registerSemesterSelect');
  sel.innerHTML = '<option value="">-- 选择学期 --</option>'+
    appData.schedules.map(s=>`<option value="${s.id}">${s.semester}学期 ${s.year}（${s.studentIds.map(getStudentName).join('、')}）</option>`).join('');
}

// ===== 登记Tab =====
function renderRegister() {
  const container = document.getElementById('registerContent');
  const schId = document.getElementById('registerSemesterSelect').value;
  if (!schId) { container.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:40px">请先选择学期</p>'; return; }
  const sch = appData.schedules.find(s=>s.id===schId);
  if (!sch) { container.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:40px">未找到排课</p>'; return; }

  const allDates = Object.keys(sch.lessons).filter(k=>sch.lessons[k].type!=='absent' && !sch.lessons[k].rescheduleTo).sort();
  let html = '';
  allDates.forEach(ds=>{
    const d = new Date(ds+'T00:00:00');
    const weekNames = ['日','一','二','三','四','五','六'];
    const l = sch.lessons[ds];
    const status = l.attended ? '✅' : '⭕';
    const feeDisplay = (l.fee||sch.feePerClass);
    html += `<div class="attendance-row" style="${l.attended?'background:#f0fdf4':''}">
      <span class="att-date">${(d.getMonth()+1)+'/'+d.getDate()} 周${weekNames[d.getDay()]}</span>
      <span style="font-size:10px;color:var(--text-secondary)">${l.time}</span>
      <span class="att-content"><input value="${escAttr(l.note||l.content||'')}" placeholder="上课内容…" onchange="updateLessonNote('${schId}','${ds}',this.value)"></span>
      <span class="att-fee">${status} ¥${feeDisplay}</span>
      <button class="btn btn-xs ${l.attended?'btn-outline':'btn-success'}" onclick="toggleLessonAttended('${schId}','${ds}')">${l.attended?'取消':'签到'}</button>
    </div>`;
  });
  if (!html) html = '<p style="text-align:center;color:#94a3b8;padding:40px">该学期暂无课程安排</p>';
  container.innerHTML = html;
}
function toggleLessonAttended(schId, dateKey) {
  const sch = appData.schedules.find(s=>s.id===schId);
  if (!sch||!sch.lessons[dateKey]) return;
  sch.lessons[dateKey].attended = !sch.lessons[dateKey].attended;
  saveData(); renderRegister();
}
function updateLessonNote(schId, dateKey, value) {
  const sch = appData.schedules.find(s=>s.id===schId);
  if (!sch||!sch.lessons[dateKey]) return;
  sch.lessons[dateKey].note = value;
  sch.lessons[dateKey].content = value;
  saveData();
}

// ===== 我的Tab =====
function renderMineTab(studentId) {
  const container = document.getElementById('mineContent');
  if (!studentId) studentId = document.getElementById('tabMine').getAttribute('data-student');
  if (!studentId || !appData.students.find(s=>s.id===studentId)) {
    if (appData.students.length>0) {
      studentId = appData.students[0].id;
      document.getElementById('tabMine').setAttribute('data-student', studentId);
    } else {
      container.innerHTML = '<p style="text-align:center;color:#94a3b8;padding:40px">请先添加学生</p>';
      return;
    }
  }
  document.getElementById('tabMine').setAttribute('data-student', studentId);
  const student = appData.students.find(s=>s.id===studentId);
  const studentSchedules = appData.schedules.filter(sch=>sch.studentIds.includes(studentId));

  // 空状态 - 带去排课按钮
  if (studentSchedules.length===0) {
    container.innerHTML = `<div style="text-align:center;padding:60px 20px;color:#94a3b8">
      <p style="font-size:64px;margin-bottom:16px">📅</p>
      <p style="font-size:16px;font-weight:600;color:var(--text);margin-bottom:8px">「${escHtml(student.name)}」还没有排课</p>
      <p style="font-size:13px;margin-bottom:20px">创建学期排课，开始管理课时费用</p>
      <button class="btn btn-primary btn-lg" onclick="switchTab('schedule')" style="min-width:160px">📅 去排课 →</button>
    </div>`;
    return;
  }

  // 累计统计
  let allTimeLessons = 0, allTimeFee = 0;
  studentSchedules.forEach(sch=>{
    if (sch.lessons) {
      for (const l of Object.values(sch.lessons)) {
        if (l.type !== 'absent' && !l.rescheduleTo) {
          allTimeLessons++;
          allTimeFee += (l.fee||sch.feePerClass);
        }
      }
    }
  });
  const lastSch = studentSchedules[studentSchedules.length-1];
  let lastAvgFee = lastSch.feePerClass;
  let lastTotalLessons = 0, lastTotalFee = 0;
  if (lastSch.lessons) {
    for (const l of Object.values(lastSch.lessons)) {
      if (l.type !== 'absent' && !l.rescheduleTo) {
        lastTotalLessons++;
        lastTotalFee += (l.fee||lastSch.feePerClass);
      }
    }
  }
  if (lastTotalLessons > 0) lastAvgFee = (lastTotalFee / lastTotalLessons).toFixed(0);

  // 学生选择器
  let studentSelector = '';
  if (appData.students.length>1) {
    studentSelector = `<div class="mine-card" style="margin-bottom:0">
      <h4>👤 选择学生</h4>
      <div class="student-tags">
        ${appData.students.map(s=>`<span class="student-tag${s.id===studentId?' selected':''}" onclick="renderMineTab('${s.id}')">${escHtml(s.name)}</span>`).join('')}
      </div>
    </div>`;
  }

  let semestersHtml = studentSchedules.map(sch=>{
    let semLessons=0, semFee=0, semAbsent=0;
    const monthlyBreakdown = {};
    const lessonDetails = [];
    if (sch.lessons) {
      for (const [ds, l] of Object.entries(sch.lessons)) {
        const fee = (l.fee||sch.feePerClass);
        if (l.type === 'absent') { semAbsent++; continue; }
        if (l.rescheduleTo) continue; // 跳过调课源日期，避免重复计数
        semLessons++;
        semFee += fee;
        const mk = ds.substring(0,7);
        if (!monthlyBreakdown[mk]) monthlyBreakdown[mk] = { lessons:0, fee:0 };
        monthlyBreakdown[mk].lessons++;
        monthlyBreakdown[mk].fee += fee;
        const d = new Date(ds+'T00:00:00');
        const weekNames = ['日','一','二','三','四','五','六'];
        lessonDetails.push({ date: ds, week: '周'+weekNames[d.getDay()], time: l.time, content: l.content||'-', fee });
      }
    }
    lessonDetails.sort((a,b)=>a.date.localeCompare(b.date));
    const sortedMonths = Object.keys(monthlyBreakdown).sort();
    let monthDetailHtml = sortedMonths.map(m=>`<tr><td>${m}</td><td>${monthlyBreakdown[m].lessons}节</td><td style="text-align:right">¥${monthlyBreakdown[m].fee.toFixed(0)}</td></tr>`).join('');

    let detailHtml = lessonDetails.map((l,i)=>`<tr>
      <td>${l.date}</td><td>${l.week}</td><td>${l.time}</td><td>${escHtml(l.content)}</td><td style="text-align:right">¥${l.fee}</td>
    </tr>`).join('');

    return `<div class="semester-item" onclick="toggleSemesterDetail(this)" style="cursor:pointer">
      <div class="sem-header">
        <div>
          <div class="sem-name">📅 ${sch.semester}学期 ${sch.year}</div>
          <div class="sem-meta">${sch.dateStart} 至 ${sch.dateEnd} · 周${sch.weekdays.map(d=>['一','二','三','四','五','六','日'][d-1]).join('、')}上课 · ¥${sch.feePerClass}/节 · 上课${semLessons}节${semAbsent?' · 请假'+semAbsent+'节':''}</div>
        </div>
        <div class="sem-fee">¥${semFee.toFixed(0)}</div>
      </div>
      <div class="semester-detail">
        <table class="monthly-table" style="margin-top:8px">
          <thead><tr><th>月份</th><th>课程</th><th style="text-align:right">费用</th></tr></thead>
          <tbody>${monthDetailHtml}
            <tr style="font-weight:600;background:#f0fdf4"><td>合计</td><td>${semLessons}节</td><td style="text-align:right;color:var(--primary)">¥${semFee.toFixed(0)}</td></tr>
          </tbody>
        </table>
        <h4 style="font-size:12px;font-weight:600;margin:12px 0 6px">📋 上课明细</h4>
        <table class="lesson-detail-table">
          <thead><tr><th>日期</th><th>星期</th><th>时间</th><th>课程内容</th><th style="text-align:right">费用</th></tr></thead>
          <tbody>${detailHtml}
            <tr style="font-weight:600;background:#f0fdf4"><td colspan="4"><strong>合计</strong></td><td style="text-align:right;color:var(--primary)"><strong>¥${semFee.toFixed(0)}</strong></td></tr>
          </tbody>
        </table>
      </div>
    </div>`;
  }).join('');

  container.innerHTML = `
    ${studentSelector}
    <div class="student-stats-row">
      <div class="stat-card"><div class="sc-label">💰 累计总学费</div><div class="sc-value">¥${allTimeFee.toFixed(0)}</div></div>
      <div class="stat-card"><div class="sc-label">📖 累计总节数</div><div class="sc-value">${allTimeLessons}</div></div>
      <div class="stat-card"><div class="sc-label">📅 排课学期</div><div class="sc-value">${studentSchedules.length}</div></div>
      <div class="stat-card highlight"><div class="sc-label">🏷 平均课时费</div><div class="sc-value">¥${lastAvgFee}</div></div>
    </div>
    <div class="mine-card">
      <h4>📚 ${escHtml(student.name)} 的排课记录</h4>
      <div class="semester-list">${semestersHtml}</div>
    </div>`;
}
function toggleSemesterDetail(el) {
  const detail = el.querySelector('.semester-detail');
  if (detail) detail.classList.toggle('open');
}

// ===== 备份恢复 =====
function exportAllData() {
  const blob = new Blob([JSON.stringify(appData,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download='课时费备份_'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('备份已下载 ✓');
}
function importDataPrompt() {
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json';
  inp.onchange=function(e){
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=function(ev){
      try{
        const d=JSON.parse(ev.target.result);
        if(!d.students||!Array.isArray(d.students)) throw new Error();
        if(!confirm('导入 '+d.students.length+' 个学生，'+((d.schedules||[]).length)+' 条排课，覆盖当前数据？')) return;
        appData=d; if(!appData.schedules) appData.schedules=[];
        saveData(); renderStudentList(); updateScheduleSelects(); renderStep1Students();
        selectedStudents.clear();
        showToast('恢复成功 ✓');
      }catch(ex){showToast('文件格式错误');}
    };
    r.readAsText(f);
  };
  inp.click();
}

// ===== 工具 =====
function escHtml(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
function escAttr(s){return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function toLocalDateStr(date){
  const y=date.getFullYear(), m=String(date.getMonth()+1).padStart(2,'0'), d=String(date.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+d;
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tid); t._tid=setTimeout(()=>t.classList.remove('show'),2000);
}

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeAddStudentModal(); closeRescheduleModal(); } });
document.getElementById('addStudentModal').addEventListener('click',function(e){if(e.target===this)closeAddStudentModal();});
document.getElementById('rescheduleModal').addEventListener('click',function(e){if(e.target===this)closeRescheduleModal();});
</script>
